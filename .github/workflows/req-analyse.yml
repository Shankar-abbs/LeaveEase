name: Req-Analyse

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  analyse:
    name: Analyse Requirement
    runs-on: ubuntu-latest
    # Only run when labeled 'requirement'
    if: github.event.label.name == 'requirement'

    steps:
      - uses: actions/checkout@v4

      - name: Check for AI runner
        id: check-key
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "runner=gemini" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "runner=anthropic" >> $GITHUB_OUTPUT
          else
            echo "runner=none" >> $GITHUB_OUTPUT
          fi

      - name: No AI runner configured
        if: steps.check-key.outputs.runner == 'none'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `> **AI runner not configured.**\n>\n> To analyse this requirement automatically, add \`GEMINI_API_KEY\` or \`ANTHROPIC_API_KEY\` as a repo secret.\n>\n> **Alternative:** Run locally in Antigravity:\n> \`\`\`\n> /requirement ${context.payload.issue.title}\n> \`\`\`\n\n*This is informational — no action needed if you prefer local analysis.*`
            });

      - name: Analyse with Gemini
        if: steps.check-key.outputs.runner == 'gemini'
        uses: google-github-actions/run-gemini-cli@v1
        with:
          api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt_file: .agent/prompts/analyse.md
          variables: |
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_TITLE=${{ github.event.issue.title }}
            ISSUE_BODY=${{ github.event.issue.body }}
            REQUIREMENTS_MD=requirements/REQUIREMENTS.md

      - name: Analyse with Claude
        if: steps.check-key.outputs.runner == 'anthropic'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt_file: .agent/prompts/analyse.md

      - name: Label as analysed
        if: steps.check-key.outputs.runner != 'none'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['analysed'],
            });
